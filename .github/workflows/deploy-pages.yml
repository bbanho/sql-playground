name: Deploy SQL Playground

# One deployment contains both channels:
#   /       -> stable, built from main
#   /beta/  -> prerelease, built from beta
#
# The two are staged into a single artifact and published together. A Pages
# deployment replaces the whole site, so publishing one channel alone would
# evict the other. This is also why there is a single upload-pages-artifact
# step: deploy-pages resolves exactly one artifact named "github-pages", and
# two uploads of that name fail the deployment.
on:
  push:
    branches: [ "main", "beta" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. The last one wins, and a half-published site
# would be worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No `cache: npm` here. Each channel is checked out into its own
      # subdirectory, so the lockfile setup-node would look for is not at the
      # workspace root, and the step fails with "Dependencies lock file is not
      # found". The two `npm ci` runs below each resolve their own lockfile.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- stable: domain root -------------------------------------------------
      - name: Checkout main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Install dependencies (stable)
        run: npm ci
        working-directory: stable

      - name: Build stable
        env:
          VITE_DEPLOY_BASE: './'
        run: npm run build
        working-directory: stable

      # --- beta: /beta/ ---------------------------------------------------------
      - name: Checkout beta (prerelease)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta

      - name: Install dependencies (beta)
        run: npm ci
        working-directory: beta

      - name: Build beta
        env:
          VITE_DEPLOY_BASE: '/beta/'
        run: npm run build
        working-directory: beta

      - name: Stage both channels
        run: |
          mkdir -p "${{ runner.temp }}/site"
          cp -r stable/dist/. "${{ runner.temp }}/site/"
          mkdir -p "${{ runner.temp }}/site/beta"
          cp -r beta/dist/. "${{ runner.temp }}/site/beta/"
          echo "--- staged tree (top 2 levels) ---"
          find "${{ runner.temp }}/site" -maxdepth 2 -not -path '*/assets/*' -not -name '*.wasm' | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
