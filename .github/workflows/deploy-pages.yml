name: Deploy SQL Playground

# main -> stable at the domain root
# beta -> prerelease under /beta/
on:
  push:
    branches: [ "main", "beta" ]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to deploy"
        required: true
        default: stable
        type: choice
        options: [ stable, beta ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            channel: stable
            base: './'
            subdir: ''
          - branch: beta
            channel: beta
            base: '/beta/'
            subdir: 'beta'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.channel }}
        env:
          VITE_DEPLOY_BASE: ${{ matrix.base }}
        run: npm run build

      - name: Stage artifact
        run: |
          mkdir -p "${{ runner.temp }}/site/${{ matrix.subdir }}"
          cp -r dist/. "${{ runner.temp }}/site/${{ matrix.subdir }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
